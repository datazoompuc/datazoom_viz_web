<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Zoom Amazônia — COMEX Exportação Municipal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="apppanel">
  <div class="menucol">
    <h2 class="plot_name" id="plot_name"></h2>
    <p class="plot_desc" id="plot_desc"></p>
    <hr>

    <p class="vars" id="label_view_name"></p>
    <div class="view-toggle" id="view-toggle">
      <button class="view-btn active" id="view-ranking" data-view="ranking"></button>
      <button class="view-btn" id="view-composition" data-view="composition"></button>
      <button class="view-btn" id="view-explore" data-view="explore"></button>
      <button class="view-btn" id="view-change" data-view="change"></button>
      <button class="view-btn" id="view-trends" data-view="trends"></button>
      <button class="view-btn" id="view-map" data-view="map"></button>
    </div>

    <div class="spacer"></div>

    <div class="var_selec_group hidden" id="change-group">
      <div class="change-years-row">
        <div class="change-year-field">
          <label id="label_year_a" for="change-year-a"></label>
          <select id="change-year-a" class="sidebar-field"></select>
        </div>
        <div class="change-year-field">
          <label id="label_year_b" for="change-year-b"></label>
          <select id="change-year-b" class="sidebar-field"></select>
        </div>
      </div>
      <div class="spacer"></div>

      <p class="vars" id="label_change_orientation"></p>
      <div class="view-toggle" id="change-orientation-toggle">
        <button class="view-btn active" id="change-orientation-municipio" data-orientation="municipio"></button>
        <button class="view-btn" id="change-orientation-produto" data-orientation="produto"></button>
      </div>
      <div class="spacer"></div>

      <div id="change-by-municipio-group">
        <label id="label_change_agg_level" for="change-agg-level-select"></label>
        <select id="change-agg-level-select" class="sidebar-field">
          <option value="all"></option>
          <option value="sec"></option>
          <option value="sh2"></option>
        </select>
        <div class="spacer"></div>
        <div id="change-category-group" class="hidden">
          <label id="label_change_category" for="change-category-select"></label>
          <select id="change-category-select" class="sidebar-field"></select>
        </div>
      </div>

      <div id="change-by-produto-group" class="hidden">
        <label id="label_change_produto_level" for="change-produto-level-select"></label>
        <select id="change-produto-level-select" class="sidebar-field">
          <option value="sec"></option>
          <option value="sh2"></option>
        </select>
        <div class="spacer"></div>
        <label id="label_change_scope" for="change-scope-select"></label>
        <select id="change-scope-select" class="sidebar-field"></select>
      </div>
    </div>

    <div class="var_selec_group slider-inline">
      <div class="sparkline-wrap">
        <svg id="year-sparkline" viewBox="0 0 260 40" preserveAspectRatio="none">
          <path id="spark-area" class="spark-area"></path>
          <path id="spark-line" class="spark-line"></path>
          <line id="spark-guide" class="spark-guide" y1="0" y2="40"></line>
          <line id="spark-hover-line" class="spark-hover-line" y1="0" y2="40"></line>
          <circle id="spark-marker" class="spark-marker" r="4"></circle>
          <circle id="spark-hover-marker" class="spark-hover-marker" r="4"></circle>
        </svg>
        <div id="spark-tooltip" class="spark-tooltip"></div>
      </div>
      <input type="range" id="year-slider" step="1" class="year-slider-full">
      <div class="slider-footer">
        <button id="play-btn" class="icon-btn" title="Play/Pause">
          <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <span class="year-caption">
          <label id="label_year" for="year-slider"></label>
          <span id="year-value" class="year-value"></span>
        </span>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="var_selec_group" id="uf-filter-group">
      <label id="label_uf_filter" for="uf-filter-select"></label>
      <select id="uf-filter-select" class="sidebar-field">
        <option value=""></option>
      </select>
    </div>

    <div class="var_selec_group hidden" id="composition-scope-group">
      <p class="vars" id="label_composition_orientation"></p>
      <div class="view-toggle" id="composition-orientation-toggle">
        <button class="view-btn active" id="composition-orientation-estado" data-orientation="estado"></button>
        <button class="view-btn" id="composition-orientation-produto" data-orientation="produto"></button>
      </div>
      <div class="spacer"></div>

      <label id="label_composition_agg" for="composition-agg-select"></label>
      <select id="composition-agg-select" class="sidebar-field">
        <option value="sec"></option>
        <option value="sh2"></option>
      </select>
      <div class="spacer"></div>

      <div id="composition-by-estado-group">
        <label id="label_composition_produto" for="composition-produto-select"></label>
        <select id="composition-produto-select" class="sidebar-field"></select>
      </div>

      <div id="composition-by-produto-group" class="hidden">
        <label id="label_composition_scope" for="composition-scope-select"></label>
        <select id="composition-scope-select" class="sidebar-field"></select>
      </div>
    </div>

    <div class="var_selec_group hidden" id="ranking-product-group">
      <p class="vars" id="label_ranking_orientation"></p>
      <div class="view-toggle" id="ranking-orientation-toggle">
        <button class="view-btn active" id="ranking-orientation-municipio" data-orientation="municipio"></button>
        <button class="view-btn" id="ranking-orientation-produto" data-orientation="produto"></button>
      </div>
      <div class="spacer"></div>

      <div id="ranking-by-municipio-group">
        <label id="label_ranking_agg_level" for="ranking-agg-level-select"></label>
        <select id="ranking-agg-level-select" class="sidebar-field">
          <option value="all"></option>
          <option value="sec"></option>
          <option value="sh2"></option>
          <option value="sh4"></option>
        </select>
        <div class="spacer"></div>

        <div id="ranking-category-group" class="hidden">
          <label id="label_ranking_category" for="ranking-category-select"></label>
          <select id="ranking-category-select" class="sidebar-field"></select>
        </div>

        <div id="ranking-sh4-group" class="hidden">
          <label id="label_ranking_product_select" for="ranking-product-select"></label>
          <select id="ranking-product-select" class="sidebar-field"></select>
          <div class="spacer"></div>
          <label id="label_ranking_product_search" for="ranking-product-input" class="prodrank-search-label"></label>
          <input type="text" id="ranking-product-input" class="sidebar-field" list="ranking-product-datalist" autocomplete="off">
          <datalist id="ranking-product-datalist"></datalist>
          <p class="prodrank-full-label" id="ranking-product-full-label"></p>
        </div>
      </div>

      <div id="ranking-by-produto-group" class="hidden">
        <label id="label_ranking_produto_level" for="ranking-produto-level-select"></label>
        <select id="ranking-produto-level-select" class="sidebar-field">
          <option value="sec"></option>
          <option value="sh2"></option>
          <option value="sh4"></option>
        </select>
        <div class="spacer"></div>
        <label id="label_ranking_scope" for="ranking-scope-select"></label>
        <select id="ranking-scope-select" class="sidebar-field"></select>
      </div>
    </div>

    <div class="var_selec_group hidden" id="trends-agg-group">
      <p class="vars" id="label_trends_orientation"></p>
      <div class="view-toggle" id="trends-orientation-toggle">
        <button class="view-btn active" id="trends-orientation-municipio" data-orientation="municipio"></button>
        <button class="view-btn" id="trends-orientation-produto" data-orientation="produto"></button>
      </div>
      <div class="spacer"></div>

      <div id="trends-by-municipio-group">
        <label id="label_trends_agg_level" for="trends-agg-level-select"></label>
        <select id="trends-agg-level-select" class="sidebar-field">
          <option value="all"></option>
          <option value="sec"></option>
          <option value="sh2"></option>
        </select>
        <div class="spacer"></div>
        <div id="trends-category-group" class="hidden">
          <label id="label_trends_category" for="trends-category-select"></label>
          <select id="trends-category-select" class="sidebar-field"></select>
        </div>
      </div>

      <div id="trends-by-produto-group" class="hidden">
        <label id="label_trends_produto_level" for="trends-produto-level-select"></label>
        <select id="trends-produto-level-select" class="sidebar-field">
          <option value="sec"></option>
          <option value="sh2"></option>
        </select>
        <div class="spacer"></div>
        <label id="label_trends_scope" for="trends-scope-select"></label>
        <select id="trends-scope-select" class="sidebar-field"></select>
      </div>

      <div class="spacer"></div>
      <p class="explore-hint" id="trends-hint"></p>
    </div>

    <div class="var_selec_group hidden" id="explore-group">
      <p class="vars" id="label_explore_orientation"></p>
      <div class="view-toggle" id="explore-orientation-toggle">
        <button class="view-btn active" id="explore-orientation-municipio" data-orientation="municipio"></button>
        <button class="view-btn" id="explore-orientation-produto" data-orientation="produto"></button>
      </div>
      <div class="spacer"></div>

      <div id="explore-by-municipio-group">
        <label id="label_explore_agg_level" for="explore-agg-level-select"></label>
        <select id="explore-agg-level-select" class="sidebar-field">
          <option value="all"></option>
          <option value="sec"></option>
          <option value="sh2"></option>
        </select>
        <div class="spacer"></div>
        <div id="explore-category-group" class="hidden">
          <label id="label_explore_category" for="explore-category-select"></label>
          <select id="explore-category-select" class="sidebar-field"></select>
          <div class="spacer"></div>
        </div>

        <label id="label_explore_munis" for="explore-munis-select"></label>
        <select id="explore-munis-select" class="sidebar-multiselect" multiple size="10"></select>
        <p class="explore-hint" id="explore-hint"></p>
      </div>

      <div id="explore-by-produto-group" class="hidden">
        <label id="label_explore_produto_level" for="explore-produto-level-select"></label>
        <select id="explore-produto-level-select" class="sidebar-field">
          <option value="sec"></option>
          <option value="sh2"></option>
        </select>
        <div class="spacer"></div>
        <label id="label_explore_scope" for="explore-scope-select"></label>
        <select id="explore-scope-select" class="sidebar-field"></select>
        <div class="spacer"></div>
        <label id="label_explore_produtos" for="explore-produtos-select"></label>
        <select id="explore-produtos-select" class="sidebar-multiselect" multiple size="10"></select>
        <p class="explore-hint" id="explore-produtos-hint"></p>
      </div>

      <div class="spacer"></div>
      <label class="switch-row">
        <input type="checkbox" id="explore-log">
        <span id="label_log_scale"></span>
      </label>
      <div class="spacer"></div>
      <label class="switch-row">
        <input type="checkbox" id="explore-index">
        <span id="label_index_first"></span>
      </label>
    </div>

    <div class="var_selec_group hidden" id="map-group">
      <p class="vars" id="label_map_mode"></p>
      <div class="view-toggle" id="map-mode-toggle">
        <button class="view-btn active" id="map-mode-forest" data-mode="forest"></button>
        <button class="view-btn" id="map-mode-all" data-mode="all"></button>
        <button class="view-btn" id="map-mode-ratio" data-mode="ratio"></button>
      </div>
      <p class="map-hint" id="map-hint"></p>
    </div>

    <div class="spacer"></div>
    <div class="var_selec_group" id="topn-group">
      <p class="vars" id="label_topn_name"></p>
      <select id="topn-select" class="sidebar-field">
        <option value="10">10</option>
        <option value="15" selected>15</option>
        <option value="20">20</option>
        <option value="30">30</option>
      </select>
    </div>

    <div class="menucol-logo" role="img" aria-label="Data Zoom"></div>
  </div>

  <div class="plotcol">
    <button id="lang-toggle" class="lang-toggle-corner">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      <span id="lang-toggle-label"></span>
    </button>
    <div class="plot-title" id="plot-title"></div>
    <div class="plot-subtitle" id="plot-subtitle"></div>

    <div class="chart-wrap">
      <div id="spinner" class="spinner"></div>

      <div id="ranking-panel" class="ranking-panel">
        <div class="ranking-header">
          <span id="ranking-axis-label" class="ranking-axis-label"></span>
          <span id="region-total-label" class="region-total-label"></span>
        </div>
        <div id="ranking-rows" class="ranking-rows"></div>
        <div id="ranking-tooltip" class="chart-tooltip"></div>
      </div>

      <div id="composition-panel" class="composition-panel hidden">
        <div id="composition-chart-area" class="composition-chart-area">
          <svg id="composition-svg" class="composition-svg" viewBox="0 0 1000 520" preserveAspectRatio="none"></svg>
          <div id="composition-tooltip" class="chart-tooltip"></div>
        </div>
        <div id="composition-legend" class="composition-legend"></div>
      </div>

      <div id="change-panel" class="change-panel hidden">
        <div class="change-header">
          <span id="change-axis-label" class="ranking-axis-label"></span>
          <div class="change-legend">
            <span class="change-legend-chip"><span class="change-legend-dot change-legend-dot-a"></span><span id="change-legend-a-label"></span></span>
            <span class="change-legend-chip"><span class="change-legend-dot change-legend-dot-b"></span><span id="change-legend-b-label"></span></span>
          </div>
        </div>
        <div class="change-axis">
          <div class="change-col-label"></div>
          <div class="change-col-track">
            <span id="change-axis-min"></span>
            <span id="change-axis-max"></span>
          </div>
          <div class="change-col-delta"></div>
        </div>
        <div class="change-scroll">
          <div id="change-rows"></div>
        </div>
        <div id="change-tooltip" class="chart-tooltip"></div>
      </div>

      <div id="trends-panel" class="trends-panel hidden">
        <div id="trends-grid" class="trends-grid"></div>
      </div>

      <div id="explore-panel" class="composition-panel hidden">
        <div id="explore-chart-area" class="composition-chart-area">
          <svg id="explore-svg" class="composition-svg" viewBox="0 0 1000 520" preserveAspectRatio="none"></svg>
          <div id="explore-tooltip" class="chart-tooltip"></div>
        </div>
        <div id="explore-legend" class="composition-legend"></div>
      </div>

      <div id="map-panel" class="map-panel hidden">
        <div id="map-container"></div>
      </div>

    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
